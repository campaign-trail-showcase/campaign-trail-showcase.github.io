        if (!Array.isArray(qArr) || qArr.length <= 1) return;
        
        if (!shuffleConfig) {
            shuffleConfig = [
                {start: 1, end: 2, type: 'fixed'},
                {start: 3, end: 24, type: 'shuffle'},
                {start: 25, end: 25, type: 'fixed'}
            ];
        }
        
        const newOrder = new Array(25);
        const fixedPositions = new Set();
        
        // identify and place fixed questions
        for (const {start, end, type} of shuffleConfig) {
            if (type === 'fixed' && start <= 25) {
                for (let pos = start; pos <= Math.min(end, 25); pos++) {
                    const idx = pos - 1;
                    newOrder[idx] = qArr[idx];
                    fixedPositions.add(idx);
                }
            }
        }
        
        // build shuffle pool
        const pool = [];
        for (let i = 0; i < qArr.length; i++) {
            if (!fixedPositions.has(i)) {
                pool.push(qArr[i]);
            }
        }
        
        // shuffle the pool
        for (let i = pool.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [pool[i], pool[j]] = [pool[j], pool[i]];
        }
        
        // fill shuffle ranges from the shuffled pool
        let poolIdx = 0;
        for (const {start, end, type} of shuffleConfig) {
            if (type === 'shuffle' && start <= 25) {
                for (let pos = start; pos <= Math.min(end, 25); pos++) {
                    const idx = pos - 1;
                    if (poolIdx < pool.length) {
                        newOrder[idx] = pool[poolIdx++];
                    }
                }
            }
        }
        
        campaignTrail_temp.questions_json = newOrder;
        console.info("Question shuffle completed.", newOrder);
    }
    
    window.questionHTML = function(...args) {
        try { performShuffle(); } catch (err) {
            console.error("Question shuffle error:", err);
        }
        return originalQuestionHTML.apply(this, args);
    };
})();
